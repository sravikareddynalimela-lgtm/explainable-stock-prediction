# Render Blueprint for the FastAPI backend.
# In Render: New + > Blueprint > pick this repo, then fill in the variables marked sync: false.
services:
  - type: web
    name: clearview-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_SOURCE
        value: yahoo
      - key: AUTO_TRAIN
        value: "1"
      - key: SUPABASE_URL
        sync: false # https://<project-ref>.supabase.co
      - key: SUPABASE_JWT_SECRET
        sync: false # only for legacy Supabase projects; leave blank otherwise
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://clearview.vercel.app
