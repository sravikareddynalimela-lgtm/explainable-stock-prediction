# Render Blueprint for the FastAPI backend.
# In Render: New + > Blueprint > pick this repo. Then set CORS_ORIGINS to your Vercel URL.
services:
  - type: web
    name: clearview-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_SOURCE
        value: yahoo
      - key: AUTO_TRAIN
        value: "1"
      - key: CORS_ORIGINS
        sync: false # e.g. https://clearview.vercel.app
